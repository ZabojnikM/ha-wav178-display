name: Check app
on:
  push:
    branches: [main, stable]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==12.3.0
      - name: Unit and local integration tests
        env:
          PYTHONPATH: wav178_display/app
        run: python -m unittest discover -s tests -v
      - name: Verify public file set
        run: python scripts/check_package.py
  containers:
    needs: python
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==12.3.0
      - name: Build native container
        env:
          BUILD_ARCH: ${{ matrix.arch }}
        run: docker build --build-arg BUILD_ARCH="$BUILD_ARCH" -t wav178:test wav178_display
      - name: Exercise container against synthetic HA and display
        run: python scripts/container_smoke.py wav178:test
